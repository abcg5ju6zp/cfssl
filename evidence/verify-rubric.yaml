rubrics:
  - id: 1
    type: f2p
    text: "刷新先固定证书集合并校验 serial、AKI、expiry 和响应签名。"
  - id: 2
    type: f2p
    text: "所有候选响应完成校验前，responder 继续返回上一确认响应。"
  - id: 3
    type: f2p
    text: "任一签名、写入或进程失败不会让数据库出现半批新响应。"
  - id: 4
    type: f2p
    text: "重启会继续未确认证书或清理候选，已确认响应不会被重复覆盖。"
  - id: 5
    type: f2p
    text: "较新的响应不会被迟到旧刷新回退，重复刷新对同一证书幂等。"
  - id: 6
    type: p2p
    text: "HTTP responder、未过期筛选和 SQLite/MySQL/PostgreSQL accessor 读取一致。"
  - id: 7
    type: p2p
    text: "空数据库、过期证书、无刷新配置和既有 OCSP 错误语义保持通过。"
