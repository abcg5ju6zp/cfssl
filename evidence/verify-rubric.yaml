rubrics:
  - id: 1
    type: f2p
    text: "ordered_list 的每个候选地址都会对签名、信息和带鉴权请求应用一次相同的请求修饰，不能只在单地址 Remote 生效。"
  - id: 2
    type: f2p
    text: "请求切换候选地址时保持相同的请求体、目标方法和鉴权材料，不会因重试而重复修改请求内容。"
  - id: 3
    type: f2p
    text: "首个地址失败时按配置顺序尝试后续地址，任一地址返回有效结果后立即停止继续请求。"
  - id: 4
    type: f2p
    text: "所有候选地址都失败时返回最后一个有诊断价值的错误，而不是丢失前面请求的失败上下文。"
  - id: 5
    type: f2p
    text: "组级请求超时和代理设置会传递到每个候选地址，并在切换过程中保持一致。"
  - id: 6
    type: p2p
    text: "Hosts 查询继续返回配置中各候选地址的顺序列表，单地址 Remote 的 Hosts 与请求行为保持原有结果。"
  - id: 7
    type: p2p
    text: "既有成功响应、HTTP 错误、服务端错误和无效地址的返回类别在普通 Remote 与 ordered_list Remote 中保持兼容。"
