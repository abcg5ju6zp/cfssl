rubrics:
  - id: 1
    type: f2p
    text: "撤销前校验 serial、AKI、原因和当前状态，未知或已完成状态得到稳定结果。"
  - id: 2
    type: f2p
    text: "证书记录、撤销原因/时间、CRL 输入和 OCSP 候选按同一代际确认。"
  - id: 3
    type: f2p
    text: "数据库、CRL 或 OCSP 任一步失败时查询仍返回上一一致状态。"
  - id: 4
    type: f2p
    text: "重启会继续未确认撤销或清理候选，已确认撤销不会丢失。"
  - id: 5
    type: f2p
    text: "重复撤销幂等，迟到旧任务不能把已撤销证书恢复为 good。"
  - id: 6
    type: p2p
    text: "CRL、OCSP 和 revoke 查询只读取同一确认代际并给出可诊断错误。"
  - id: 7
    type: p2p
    text: "未撤销证书的签发、空撤销库和既有 API 响应格式保持通过。"
